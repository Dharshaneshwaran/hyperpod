[package]
name = "hyperpot-worker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hyperpot-worker"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
